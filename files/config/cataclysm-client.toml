
[client]
	#Off the Custom Rendering
	shadersCompat = false
	#ScreenShake(on/off)
	"ScreenShake(on/off)" = true
	#Forced viewpoint change when hit by a grab attack
	"setThirdPerson(on/off)" = true
	#Forced viewpoint change when hit by a grab attack
	"setFirstPerson(on/off)" = true
	#custombossbar(on/off)
	"custombossbar(on/off)" = true
	#Shonen Eveil: no Cataclysm boss music (it plays on top of the pack's dynamic music, Ambience Mini, which has its own boss rules).
	"BossMusic(on/off)" = false
	#BossMusicVolume
	#Range: 1 ~ 100
	BossMusicVolume = 1
	#showLoginNotice(on/off)
	"showLoginNotice(on/off)" = true
